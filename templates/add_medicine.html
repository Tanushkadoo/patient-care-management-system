<!DOCTYPE html>
<html>
<head>

    <title>Add Medicine</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div id="google_translate_element"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {pageLanguage: 'en', includedLanguages: 'hi,mr,ta,te,bn,gu,kn,ml,pa,ur', layout: google.translate.TranslateElement.InlineLayout.SIMPLE},
      'google_translate_element'
    );
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<div class="form-container">
<div class="form-box">

<h1>Add Medicine</h1>
<form method="POST">

<label>Medicine Name</label>

<input
type="text"
name="medicine_name"
required>

<label>Category</label>

<input
type="text"
name="category"
required>

<label>Manufacturer</label>

<input
type="text"
name="manufacturer"
required>
<label>Batch Number</label>
<input
type="text"
name="batch_no"
required>
<label>Stock</label>
<input
type="number"
name="stock"
required>

<label>Unit Price</label>

<input
type="number"
step="0.01"
name="unit_price"
required>

<label>Expiry Date</label>

<input
type="date"
name="expiry_date"
required>

<button type="submit">

Save Medicine

</button>

</form>

<a href="/dashboard" class="back-btn">

← Back

</a>

</div>

</div>

</body>
</html>
