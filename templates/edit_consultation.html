<!DOCTYPE html>
<html>
<head>
    <title>Edit Consultation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="google_translate_element"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {pageLanguage: 'en', includedLanguages: 'hi,mr,ta,te,bn,gu,kn,ml,pa,ur', layout: google.translate.TranslateElement.InlineLayout.SIMPLE},
      'google_translate_element'
    );
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<div class="form-container">

<div class="form-box">

<h1>Edit Consultation</h1>

<form method="POST">

<label>Select Patient</label>

<select name="patient_id" required>

{% for patient in patients %}

<option value="{{ patient[0] }}"
{% if patient[0] == consultation[1] %}selected{% endif %}>
{{ patient[1] }}
</option>

{% endfor %}

</select>

<label>Select Doctor</label>

<select name="doctor_id" required>

{% for doctor in doctors %}

<option value="{{ doctor[0] }}"
{% if doctor[0] == consultation[2] %}selected{% endif %}>
{{ doctor[1] }}
</option>

{% endfor %}

</select>

<label>Symptoms</label>
<textarea name="symptoms" rows="4" required>{{ consultation[3] }}</textarea>

<label>Diagnosis</label>
<textarea name="diagnosis" rows="4" required>{{ consultation[4] }}</textarea>

<label>Treatment</label>
<textarea name="treatment" rows="4" required>{{ consultation[5] }}</textarea>

<label>Consultation Date</label>
<input type="date"
name="consultation_date"
value="{{ consultation[6] }}"
required>

<button type="submit">
Update Consultation
</button>

</form>

<a href="/view_consultation" class="back-btn">
← Back
</a>

</div>

</div>

</body>
</html>
