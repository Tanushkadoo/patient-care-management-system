<!DOCTYPE html>
<html>

<head>

    <title>Low Stock Alert</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>
<div id="google_translate_element"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {pageLanguage: 'en', includedLanguages: 'hi,mr,ta,te,bn,gu,kn,ml,pa,ur', layout: google.translate.TranslateElement.InlineLayout.SIMPLE},
      'google_translate_element'
    );
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<div class="page-container">

<div class="page-header">

<h1>Low Stock Medicines</h1>

<a href="/pharmacist_dashboard" class="btn-primary">
Back
</a>

</div>

<table class="data-table">

<tr>

<th>ID</th>
<th>Medicine</th>
<th>Category</th>
<th>Manufacturer</th>
<th>Stock</th>
<th>Price</th>
<th>Expiry</th>

</tr>

{% for medicine in medicines %}

<tr>

<td>{{ medicine[0] }}</td>
<td>{{ medicine[1] }}</td>
<td>{{ medicine[2] }}</td>
<td>{{ medicine[3] }}</td>
<td>{{ medicine[5] }}</td>
<td>{{ medicine[6] }}</td>
<td>{{ medicine[7] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
