<!DOCTYPE html>
<html>

<head>

    <title>Dispensing History</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>
<div id="google_translate_element"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {pageLanguage: 'en', includedLanguages: 'hi,mr,ta,te,bn,gu,kn,ml,pa,ur', layout: google.translate.TranslateElement.InlineLayout.SIMPLE},
      'google_translate_element'
    );
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<div class="page-container">

<div class="page-header">

<h1>Dispensing History</h1>

<a href="/pharmacist_dashboard" class="btn-primary">
Back
</a>

</div>

<table class="data-table">

<tr>

<th>ID</th>
<th>Medicine</th>
<th>Patient</th>
<th>Quantity</th>
<th>Date</th>

</tr>

{% for record in records %}

<tr>

<td>{{ record[0] }}</td>
<td>{{ record[1] }}</td>
<td>{{ record[2] }}</td>
<td>{{ record[3] }}</td>
<td>{{ record[4] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
