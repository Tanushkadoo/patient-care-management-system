<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurses Management</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>
<div id="google_translate_element"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {pageLanguage: 'en', includedLanguages: 'hi,mr,ta,te,bn,gu,kn,ml,pa,ur', layout: google.translate.TranslateElement.InlineLayout.SIMPLE},
      'google_translate_element'
    );
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div class="page-container">
        <div class="page-header">
            <h1> Nurses Management</h1>
            <a href="/add_nurse" class="btn-primary">
                + Add Nurse
            </a>
        </div>

        <table class="data-table">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nurse Name</th>
                    <th>Department</th>
                    <th>Shift</th>
                    <th>Phone</th>
                    <th>Experience</th>
                    <th>Actions</th>

                </tr>
            </thead>

            <tbody>
                {% for nurse in nurses %}

                <tr>
                    <td>{{ nurse[0] }}</td>
                    <td>{{ nurse[1] }}</td>
                    <td>{{ nurse[2] }}</td>
                    <td>{{ nurse[3] }}</td>
                    <td>{{ nurse[4] }}</td>
                    <td>{{ nurse[5] }} Years</td>

                    <td>

                        <a href="/edit_nurse/{{ nurse[0] }}"
                           class="edit-btn">
                            Edit
                        </a>

                        <a href="/delete_nurse/{{ nurse[0] }}"
                           class="delete-btn"
                           onclick="return confirm('Are you sure you want to delete this nurse?')">
                            Delete
                        </a>

                    </td>
                </tr>

                {% endfor %}
            </tbody>

        </table>
        <br>
        <a href="/dashboard" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
