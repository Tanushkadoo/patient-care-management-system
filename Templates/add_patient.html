<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>
<div id="google_translate_element"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {pageLanguage: 'en', includedLanguages: 'hi,mr,ta,te,bn,gu,kn,ml,pa,ur', layout: google.translate.TranslateElement.InlineLayout.SIMPLE},
      'google_translate_element'
    );
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div class="form-container">
        <div class="form-box">
            <h1> Add Patient</h1>
            <form method="POST">

                <label>Patient Name</label>
                <input
                    type="text"
                    name="patient_name"
                    placeholder="Enter patient name"
                    required>

                <label>Age</label>
                <input
                    type="number"
                    name="age"
                    placeholder="Enter age"
                    required>

                <label>Disease</label>
                <input
                    type="text"
                    name="disease"
                    placeholder="Enter disease"
                    required>

                <label>Phone</label>
                <input
                    type="text"
                    name="phone"
                    placeholder="Enter phone number"
                    required>

                <label>Gender</label>

                <select name="gender" required>
                    <option value="">-- Select Gender --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>

                </select>

                <label>Aadhaar Number</label><br>
                <input type="text" name="aadhaar_number" required>

                <br><br>

                <label>Blood Group</label>
                <select name="blood_group" required>

                    <option value="">-- Select Blood Group --</option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>

                <label>Address</label>
                <textarea
                    name="address"
                    rows="4"
                    placeholder="Enter patient address"
                    required></textarea>

                <button type="submit">
                    Add Patient
                </button>
            </form>

            <br>
            <a href="/view_patients" class="back-btn">
                ← Back to Patients List
            </a>
        </div>
    </div>

</body>

</html>
