<!DOCTYPE html>
<html>
<head>
    <title>My Laboratory Reports</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="google_translate_element"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {pageLanguage: 'en', includedLanguages: 'hi,mr,ta,te,bn,gu,kn,ml,pa,ur', layout: google.translate.TranslateElement.InlineLayout.SIMPLE},
      'google_translate_element'
    );
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<div class="page-container">

    <div class="page-header">
        <h1>My Laboratory Reports</h1>
    </div>

    {% if reports %}

    <table class="data-table">

        <tr>
            <th>ID</th>
            <th>Doctor</th>
            <th>Test Name</th>
            <th>Test Date</th>
            <th>Result</th>
            <th>Status</th>
        </tr>

        {% for report in reports %}

        <tr>
            <td>{{ report[0] }}</td>
            <td>{{ report[1] }}</td>
            <td>{{ report[2] }}</td>
            <td>{{ report[3] }}</td>
            <td>{{ report[4] }}</td>
            <td>{{ report[5] }}</td>
        </tr>

        {% endfor %}

    </table>

    {% else %}

    <h3>No Laboratory Reports Found.</h3>

    {% endif %}

    <br>

    <a href="/dashboard" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
